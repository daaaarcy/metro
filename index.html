<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金鐘站 Admiralty Station — 3D Layout</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23e2231a'/><text x='16' y='22' font-size='14' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>ADM</text></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="ui">
    <header id="masthead">
      <img class="mtr-badge" src="/mtr-logo.svg" alt="MTR" />
      <div>
        <h1>金鐘站 <span>Admiralty Station</span></h1>
        <p class="sub">3D layout viewer · 立體車站結構圖</p>
      </div>
    </header>

    <aside id="panel">
      <button id="panel-close" title="Hide panel (H)">×</button>
      <section>
        <h2>View 視角</h2>
        <div class="btn-row" id="mode-buttons">
          <button data-mode="orbit">Orbit 環視</button>
          <button data-mode="walk" class="active">Walk 步行</button>
        </div>
      </section>

      <section>
        <h2>Section 剖面</h2>
        <div class="btn-row" id="clip-buttons">
          <button data-clip="none" class="active">Full 全貌</button>
          <button data-clip="z">Long 縱切</button>
          <button data-clip="x">Cross 橫切</button>
          <button data-clip="y">Top 由上</button>
        </div>
        <input type="range" id="clip-slider" min="0" max="1" step="0.001" value="1" disabled />
        <p class="sec-hint">Pick a cut, then drag the slider to sweep through the station.<br />選擇切面，再拉動滑桿逐層檢視車站內部。</p>
      </section>

      <section>
        <h2>Levels 樓層</h2>
        <div id="level-list"></div>
      </section>

      <section>
        <h2>Lines 路綫</h2>
        <div id="legend"></div>
      </section>

      <section class="toggles">
        <label><input type="checkbox" id="toggle-labels" checked /> Labels 標籤</label>
        <label><input type="checkbox" id="toggle-audio" /> Sound 廣播</label>
        <label><input type="checkbox" id="toggle-people" checked /> Passengers 乘客</label>
      </section>
    </aside>

    <button id="panel-open" title="Show panel (H)">☰ Controls 控制</button>
    <div id="info"></div>
    <div id="prompt"></div>
    <div id="board">
      <div id="clock">
        <span id="clock-time">--:--</span>
        <span id="clock-date">HKT 香港時間</span>
        <div id="speed-buttons">
          <button data-speed="1" class="active">1×</button>
          <button data-speed="2">2×</button>
          <button data-speed="4">4×</button>
          <button data-speed="8">8×</button>
        </div>
      </div>
      <div id="ticker"></div>
      <div id="weather"></div>
    </div>
    <div id="hint">Orbit: drag · Walk: WASD + drag (E = tap Octopus, H = hide panel)</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

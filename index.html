<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金鐘站 Admiralty Station — 3D Layout</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23e2231a'/><text x='16' y='22' font-size='14' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>ADM</text></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="ui">
    <header id="masthead">
      <div class="mtr-badge" aria-label="MTR">
        <svg viewBox="0 0 32 32" width="30" height="30">
          <rect width="32" height="32" rx="6" fill="#fff"/>
          <g fill="#12307c">
            <path d="M13.4 5.2 A11 11 0 0 0 13.4 26.8 Z"/>
            <path d="M18.6 5.2 A11 11 0 0 1 18.6 26.8 Z"/>
            <rect x="14.6" y="3.4" width="2.8" height="25.2" rx="1.4"/>
          </g>
        </svg>
      </div>
      <div>
        <h1>金鐘站 <span>Admiralty Station</span></h1>
        <p class="sub">3D layout viewer · 立體車站結構圖</p>
      </div>
    </header>

    <aside id="panel">
      <section>
        <h2>View 視角</h2>
        <div class="btn-row" id="mode-buttons">
          <button data-mode="orbit" class="active">Orbit 環視</button>
          <button data-mode="walk">Walk 步行</button>
          <button data-mode="fly">Fly 飛行</button>
        </div>
      </section>

      <section>
        <h2>Section 剖面</h2>
        <div class="btn-row" id="clip-buttons">
          <button data-clip="none" class="active">Off</button>
          <button data-clip="z">Longitudinal</button>
          <button data-clip="x">Cross</button>
          <button data-clip="y">Top</button>
        </div>
        <input type="range" id="clip-slider" min="0" max="1" step="0.001" value="1" disabled />
      </section>

      <section>
        <h2>Levels 樓層</h2>
        <div id="level-list"></div>
      </section>

      <section>
        <h2>Lines 路綫</h2>
        <div id="legend"></div>
      </section>

      <section class="toggles">
        <label><input type="checkbox" id="toggle-labels" checked /> Labels 標籤</label>
        <label><input type="checkbox" id="toggle-audio" /> Sound 廣播</label>
        <label><input type="checkbox" id="toggle-people" checked /> Passengers 乘客</label>
      </section>
    </aside>

    <div id="info"></div>
    <div id="prompt"></div>
    <div id="ticker"></div>
    <div id="hint">Orbit: drag · Walk: WASD + drag (E = tap Octopus) · Fly: WASD + E/Q + scroll speed</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
